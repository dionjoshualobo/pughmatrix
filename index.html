<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matrix Workshop</title>
  <style>
    :root {
      --ink: #17211b;
      --muted: #6a756d;
      --line: #dce5df;
      --paper: #f7faf6;
      --panel: #ffffff;
      --accent: #286b52;
      --accent-soft: #e2f0e9;
      --shadow: 0 18px 50px rgba(34, 61, 45, .09);
      font-family: "Avenir Next", Avenir, "Trebuchet MS", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: radial-gradient(circle at 8% 0%, #edf5ef 0, transparent 33rem), var(--paper); }
    button, select, input { font: inherit; }
    button { cursor: pointer; }
    .app-shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 38px 0 56px; }
    .masthead { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 28px; }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: .73rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.1rem, 5vw, 4.4rem); line-height: .96; letter-spacing: -.06em; font-weight: 800; }
    .intro { max-width: 420px; margin: 0 0 4px; color: var(--muted); line-height: 1.55; font-size: .95rem; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; padding: 16px; background: rgba(255,255,255,.82); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
    .field { display: grid; gap: 7px; min-width: 150px; }
    .field label { color: var(--muted); font-size: .7rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    select, .text-input, .number-input { width: 100%; height: 40px; padding: 0 11px; color: var(--ink); background: #fbfdfb; border: 1px solid var(--line); border-radius: 8px; outline: none; }
    select:focus, .text-input:focus, .number-input:focus, [contenteditable="true"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(40,107,82,.12); }
    .range-field { min-width: 190px; }
    .range-control { display: flex; align-items: center; gap: 9px; height: 40px; }
    .range-control input { width: 125px; accent-color: var(--accent); }
    .range-control output { min-width: 38px; color: var(--muted); font-size: .82rem; }
    .button { height: 40px; padding: 0 15px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font-weight: 750; }
    .button:hover { border-color: var(--accent); color: var(--accent); }
    .button.primary { border-color: var(--accent); background: var(--accent); color: white; }
    .button.primary:hover { background: #1d5943; color: white; }
    .button.ghost { margin-left: auto; }
    .workspace { margin-top: 20px; padding: clamp(16px, 3vw, 32px); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
    .workspace-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
    .workspace-title { margin: 0; font-size: 1rem; letter-spacing: -.01em; }
    .save-state { color: var(--muted); font-size: .78rem; }
    .matrix-wrap { overflow-x: auto; padding-bottom: 4px; }
    .matrix { display: grid; gap: 8px; min-width: 650px; }
    .matrix-box { position: relative; display: flex; min-height: 92px; padding: 12px; border: 1px solid rgba(31, 51, 40, .12); border-radius: 8px; background: #f4f7f4; transition: transform .16s ease, box-shadow .16s ease; }
    .matrix-box:hover { z-index: 2; transform: translateY(-2px); box-shadow: 0 7px 18px rgba(26, 56, 38, .11); }
    .axis-box { min-height: 61px; align-items: center; justify-content: center; background: #edf4ef; }
    .corner-box { background: var(--ink); color: white; }
    .group-box { min-height: 61px; align-items: center; justify-content: center; background: #edf4ef; }
    .group-box .editable { max-width: calc(100% - 28px); text-align: center; }
    .group-toggle { position: absolute; top: 6px; right: 7px; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--muted); font-size: 1.1rem; line-height: 1; }
    .group-toggle:hover { background: rgba(40, 107, 82, .1); color: var(--accent); }
    .group-add { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--accent); font-size: 1.5rem; line-height: 1; }
    .group-add:hover { border-color: var(--accent); background: var(--accent-soft); }
    .cell-box { align-items: stretch; }
    .editable { width: 100%; min-height: 24px; outline: none; line-height: 1.35; white-space: pre-wrap; word-break: break-word; }
    .axis-box .editable { text-align: center; font-weight: 800; }
    .cell-box .editable { display: flex; align-items: center; justify-content: center; min-height: 100%; padding-bottom: 0; text-align: center; font-size: .91rem; font-weight: 650; cursor: text; }
    .color-button { position: absolute; right: 7px; bottom: 7px; width: 22px; height: 22px; padding: 0; border: 2px solid rgba(255,255,255,.92); border-radius: 50%; background: #b7c8bd; box-shadow: 0 1px 5px rgba(0,0,0,.18); opacity: 0; pointer-events: none; transition: opacity .12s ease; }
    .cell-box.selected .color-button { opacity: 1; pointer-events: auto; }
    .color-menu { position: absolute; z-index: 5; right: 4px; bottom: 31px; display: flex; gap: 5px; padding: 7px; background: white; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(23, 45, 31, .18); }
    .color-menu[hidden] { display: none; }
    .swatch { width: 20px; height: 20px; padding: 0; border: 1px solid rgba(0,0,0,.12); border-radius: 50%; }
    .swatch.clear { background: #f4f7f4; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .hint { margin: 16px 0 0; color: var(--muted); font-size: .78rem; }
    @media (max-width: 700px) {
      .app-shell { width: min(100% - 20px, 1180px); padding-top: 24px; }
      .masthead { display: block; }
      .intro { margin-top: 14px; }
      .toolbar { align-items: stretch; }
      .field { flex: 1 1 130px; }
      .button.ghost { margin-left: 0; }
      .workspace-head { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="masthead">
      <div><p class="eyebrow">A thinking surface</p><h1>Matrix<br>Workshop</h1></div>
      <p class="intro">Build a clear comparison grid, color the important signals, and keep your thinking close at hand.</p>
    </header>

    <section class="toolbar" aria-label="Matrix setup">
      <div class="field"><label for="matrixName">Matrix name</label><input id="matrixName" class="text-input" type="text" placeholder="Optional name" maxlength="80"></div>
      <div class="field"><label for="columns">Columns</label><select id="columns"><option value="1">1 column</option><option value="2" selected>2 columns</option><option value="3">3 columns</option><option value="4">4 columns</option><option value="5">5 columns</option><option value="6">6 columns</option><option value="7">7 columns</option><option value="8">8 columns</option></select></div>
      <div class="field"><label for="rows">Rows</label><select id="rows"><option value="1">1 row</option><option value="2" selected>2 rows</option><option value="3">3 rows</option><option value="4">4 rows</option><option value="5">5 rows</option><option value="6">6 rows</option><option value="7">7 rows</option><option value="8">8 rows</option></select></div>
      <div class="field range-field"><label for="cornerSize">Corner size</label><div class="range-control"><input id="cornerSize" type="range" min="160" max="360" step="4" value="232"><output id="cornerSizeValue" for="cornerSize">232px</output></div></div>
      <button id="reset" class="button ghost" type="button">Reset</button>
      <button id="download" class="button primary" type="button">↓&nbsp; Download as image</button>
    </section>

    <section class="workspace">
      <div class="workspace-head"><h2 id="workspaceTitle" class="workspace-title">Untitled matrix</h2><span id="saveState" class="save-state" aria-live="polite">Saved locally</span></div>
      <div class="matrix-wrap"><div id="matrix" class="matrix" aria-label="Editable matrix"></div></div>
      <p class="hint">Click anywhere in a label or cell to edit. Hover a cell for color controls.</p>
    </section>
  </main>
  <script>
    (function () {
      'use strict';
      var STORAGE_KEY = 'matrix-workshop-state';
      var colors = ['#00ef00', '#f9dfdc', '#fff000', '#00e5e5', '#dce8f4', '#ff7100', '#ed071b', '#f4f7f4'];
      var matrixName = document.getElementById('matrixName');
      var columns = document.getElementById('columns');
      var rows = document.getElementById('rows');
      var cornerSize = document.getElementById('cornerSize');
      var cornerSizeValue = document.getElementById('cornerSizeValue');
      var matrix = document.getElementById('matrix');
      var workspaceTitle = document.getElementById('workspaceTitle');
      var saveState = document.getElementById('saveState');
      var state = loadState();

      function defaultState(rowCount, columnCount) {
        return { name: '', cornerSize: 232, rows: rowCount || 2, cols: columnCount || 2, topLabel: 'Top label', leftLabel: 'Side label', topVisible: true, leftVisible: true, rowLabels: ['Agree', 'Disagree'], colLabels: ['Agrees', 'Disagrees'], cells: [] };
      }

      function loadState() {
        try {
          var saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && saved.size) return { name: '', cornerSize: 232, rows: saved.size, cols: saved.size, topLabel: 'Top label', leftLabel: 'Side label', topVisible: true, leftVisible: true, rowLabels: saved.rowLabels || [], colLabels: saved.colLabels || [], cells: saved.cells || [] };
          if (saved && saved.rows && saved.cols) { saved.name = saved.name || ''; saved.cornerSize = Number(saved.cornerSize) || 232; saved.topVisible = saved.topVisible !== false; saved.leftVisible = saved.leftVisible !== false; return saved; }
          return defaultState(2, 2);
        } catch (error) { return defaultState(2, 2); }
      }

      function ensureState() {
        while (state.rowLabels.length < state.rows) state.rowLabels.push('Row ' + (state.rowLabels.length + 1));
        while (state.colLabels.length < state.cols) state.colLabels.push('Column ' + (state.colLabels.length + 1));
        state.rowLabels.length = state.rows;
        state.colLabels.length = state.cols;
        while (state.cells.length < state.rows * state.cols) state.cells.push({ text: '', color: '' });
        state.cells.length = state.rows * state.cols;
      }

      function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        saveState.textContent = 'Saved locally · ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      }

      function getLayout() {
        var size = Number(state.cornerSize) || 232;
        var sideWidth = Math.round(size / 2);
        var topHeight = Math.round(size / 2);
        return { sideWidth: sideWidth, labelWidth: size - sideWidth, topHeight: topHeight, headerHeight: size - topHeight, cellWidth: 160, cellHeight: 92 };
      }

      function editable(text, type, index) {
        var element = document.createElement('div');
        element.className = 'editable'; element.contentEditable = 'true'; element.spellcheck = false; element.textContent = text;
        element.addEventListener('input', function () { if (type === 'row') state.rowLabels[index] = element.textContent; else if (type === 'col') state.colLabels[index] = element.textContent; else if (type === 'top') state.topLabel = element.textContent; else if (type === 'left') state.leftLabel = element.textContent; else state.cells[index].text = element.textContent; save(); });
        return element;
      }

      function createColorMenu(cell, index) {
        var menu = document.createElement('div'); menu.className = 'color-menu'; menu.hidden = true;
        colors.forEach(function (color, colorIndex) { var swatch = document.createElement('button'); swatch.type = 'button'; swatch.className = 'swatch' + (colorIndex === colors.length - 1 ? ' clear' : ''); swatch.style.backgroundColor = color; swatch.setAttribute('aria-label', colorIndex === colors.length - 1 ? 'Clear color' : 'Choose color'); swatch.addEventListener('click', function () { state.cells[index].color = colorIndex === colors.length - 1 ? '' : color; cell.style.backgroundColor = state.cells[index].color || '#f4f7f4'; menu.hidden = true; cell.classList.remove('selected'); save(); }); menu.appendChild(swatch); });
        return menu;
      }

      function addGroupContent(box, type, label) {
        var visibleKey = type + 'Visible';
        if (state[visibleKey]) {
          box.appendChild(editable(label, type, 0));
          var close = document.createElement('button'); close.type = 'button'; close.className = 'group-toggle'; close.textContent = '×'; close.setAttribute('aria-label', 'Hide ' + type + ' label');
          close.addEventListener('click', function (event) { event.stopPropagation(); state[visibleKey] = false; render(); save(); });
          box.appendChild(close);
        } else {
          var add = document.createElement('button'); add.type = 'button'; add.className = 'group-add'; add.textContent = '+'; add.setAttribute('aria-label', 'Show ' + type + ' label');
          add.addEventListener('click', function (event) { event.stopPropagation(); state[visibleKey] = true; render(); save(); });
          box.appendChild(add);
        }
      }

      function render() {
        ensureState();
        var layout = getLayout();
        matrixName.value = state.name; columns.value = state.cols; rows.value = state.rows; cornerSize.value = state.cornerSize; cornerSizeValue.value = state.cornerSize + 'px'; workspaceTitle.textContent = state.name || 'Untitled matrix';
        matrix.innerHTML = ''; matrix.style.gridTemplateColumns = layout.sideWidth + 'px ' + layout.labelWidth + 'px repeat(' + state.cols + ', ' + layout.cellWidth + 'px)'; matrix.style.gridTemplateRows = layout.topHeight + 'px ' + layout.headerHeight + 'px repeat(' + state.rows + ', ' + layout.cellHeight + 'px)';
        var corner = document.createElement('div'); corner.className = 'matrix-box corner-box'; corner.style.gridColumn = '1 / span 2'; corner.style.gridRow = '1 / span 2'; matrix.appendChild(corner);
        var topGroup = document.createElement('div'); topGroup.className = 'matrix-box group-box'; topGroup.style.gridColumn = '3 / span ' + state.cols; topGroup.style.gridRow = '1'; addGroupContent(topGroup, 'top', state.topLabel); matrix.appendChild(topGroup);
        state.colLabels.forEach(function (label, index) { var box = document.createElement('div'); box.className = 'matrix-box axis-box'; box.style.gridColumn = String(index + 3); box.style.gridRow = '2'; box.appendChild(editable(label, 'col', index)); matrix.appendChild(box); });
        var leftGroup = document.createElement('div'); leftGroup.className = 'matrix-box group-box'; leftGroup.style.gridColumn = '1'; leftGroup.style.gridRow = '3 / span ' + state.rows; addGroupContent(leftGroup, 'left', state.leftLabel); matrix.appendChild(leftGroup);
        state.rowLabels.forEach(function (label, row) { var axis = document.createElement('div'); axis.className = 'matrix-box axis-box'; axis.style.gridColumn = '2'; axis.style.gridRow = String(row + 3); axis.appendChild(editable(label, 'row', row)); matrix.appendChild(axis); for (var col = 0; col < state.cols; col += 1) { var index = row * state.cols + col; var cell = document.createElement('div'); cell.className = 'matrix-box cell-box'; cell.style.gridColumn = String(col + 3); cell.style.gridRow = String(row + 3); cell.style.backgroundColor = state.cells[index].color || '#f4f7f4'; var editor = editable(state.cells[index].text, 'cell', index); cell.appendChild(editor); cell.addEventListener('click', function (event) { var selected = event.currentTarget; document.querySelectorAll('.cell-box.selected').forEach(function (other) { if (other !== selected) other.classList.remove('selected'); }); selected.classList.add('selected'); if (!event.target.closest('.color-button, .color-menu')) selected.querySelector('.editable').focus(); }); var colorButton = document.createElement('button'); colorButton.type = 'button'; colorButton.className = 'color-button'; colorButton.style.backgroundColor = state.cells[index].color || '#b7c8bd'; colorButton.setAttribute('aria-label', 'Choose cell color'); var menu = createColorMenu(cell, index); colorButton.addEventListener('click', function (event) { event.stopPropagation(); var currentMenu = event.currentTarget.parentNode.querySelector('.color-menu'); document.querySelectorAll('.color-menu').forEach(function (other) { if (other !== currentMenu) other.hidden = true; }); currentMenu.hidden = !currentMenu.hidden; }); cell.appendChild(colorButton); cell.appendChild(menu); matrix.appendChild(cell); } });
      }

      matrixName.addEventListener('input', function () { state.name = matrixName.value.trim(); workspaceTitle.textContent = state.name || 'Untitled matrix'; save(); });
      columns.addEventListener('change', function () { state.cols = Number(columns.value); render(); save(); });
      rows.addEventListener('change', function () { state.rows = Number(rows.value); render(); save(); });
      cornerSize.addEventListener('input', function () { state.cornerSize = Number(cornerSize.value); cornerSizeValue.value = state.cornerSize + 'px'; render(); save(); });
      document.getElementById('reset').addEventListener('click', function () { if (window.confirm('Reset this matrix and clear all saved work?')) { state = defaultState(2, 2); render(); save(); } });
      document.addEventListener('click', function (event) { if (!event.target.closest('.cell-box')) { document.querySelectorAll('.cell-box.selected').forEach(function (cell) { cell.classList.remove('selected'); }); document.querySelectorAll('.color-menu').forEach(function (menu) { menu.hidden = true; }); } });
      window.addEventListener('keydown', function (event) {
        if ((event.ctrlKey || event.metaKey) && event.shiftKey && event.key.toLowerCase() === 'r') {
          event.preventDefault();
          localStorage.removeItem(STORAGE_KEY);
          window.location.reload();
        }
      });

      document.getElementById('download').addEventListener('click', function () {
        var layout = getLayout(), scale = 2, sideWidth = layout.sideWidth, labelWidth = layout.labelWidth, cellWidth = layout.cellWidth, topHeight = layout.topHeight, headerHeight = layout.headerHeight, cellHeight = layout.cellHeight, titleHeight = state.name ? 48 : 0, width = sideWidth + labelWidth + state.cols * cellWidth, height = titleHeight + topHeight + headerHeight + state.rows * cellHeight, canvas = document.createElement('canvas');
        canvas.width = width * scale; canvas.height = height * scale;
        var context = canvas.getContext('2d'); context.scale(scale, scale); context.fillStyle = '#ffffff'; context.fillRect(0, 0, width, height);
        function roundedRect(x, y, boxWidth, boxHeight, radius, fill) { context.beginPath(); context.moveTo(x + radius, y); context.lineTo(x + boxWidth - radius, y); context.quadraticCurveTo(x + boxWidth, y, x + boxWidth, y + radius); context.lineTo(x + boxWidth, y + boxHeight - radius); context.quadraticCurveTo(x + boxWidth, y + boxHeight, x + boxWidth - radius, y + boxHeight); context.lineTo(x + radius, y + boxHeight); context.quadraticCurveTo(x, y + boxHeight, x, y + boxHeight - radius); context.lineTo(x, y + radius); context.quadraticCurveTo(x, y, x + radius, y); context.closePath(); context.fillStyle = fill; context.fill(); context.strokeStyle = 'rgba(31, 51, 40, .12)'; context.stroke(); }
        function drawText(text, x, y, boxWidth, boxHeight, color, weight) { if (!text) return; var lines = text.split('\n'), lineHeight = 17, startY = y + (boxHeight - lines.length * lineHeight) / 2 + 13; context.fillStyle = color; context.font = weight + ' 14px Avenir Next, sans-serif'; context.textAlign = 'center'; lines.forEach(function (line, lineIndex) { context.fillText(line, x + boxWidth / 2, startY + lineIndex * lineHeight); }); }
        if (state.name) { context.fillStyle = '#17211b'; context.font = '700 22px Avenir Next, sans-serif'; context.textAlign = 'left'; context.fillText(state.name, 0, 30); }
        roundedRect(0, titleHeight, sideWidth + labelWidth, topHeight + headerHeight, 0, '#17211b');
        if (state.topVisible) { roundedRect(sideWidth + labelWidth, titleHeight, state.cols * cellWidth, topHeight, 8, '#edf4ef'); drawText(state.topLabel, sideWidth + labelWidth, titleHeight, state.cols * cellWidth, topHeight, '#17211b', '700'); }
        state.colLabels.forEach(function (label, col) { roundedRect(sideWidth + labelWidth + col * cellWidth, titleHeight + topHeight, cellWidth, headerHeight, 8, '#edf4ef'); drawText(label, sideWidth + labelWidth + col * cellWidth, titleHeight + topHeight, cellWidth, headerHeight, '#17211b', '700'); });
        if (state.leftVisible) { roundedRect(0, titleHeight + topHeight + headerHeight, sideWidth, state.rows * cellHeight, 8, '#edf4ef'); drawText(state.leftLabel, 0, titleHeight + topHeight + headerHeight, sideWidth, state.rows * cellHeight, '#17211b', '700'); }
        state.rowLabels.forEach(function (label, row) { var y = titleHeight + topHeight + headerHeight + row * cellHeight; roundedRect(sideWidth, y, labelWidth, cellHeight, 8, '#edf4ef'); drawText(label, sideWidth, y, labelWidth, cellHeight, '#17211b', '700'); for (var col = 0; col < state.cols; col += 1) { var cell = state.cells[row * state.cols + col], x = sideWidth + labelWidth + col * cellWidth; roundedRect(x, y, cellWidth, cellHeight, 8, cell.color || '#f4f7f4'); drawText(cell.text, x, y, cellWidth, cellHeight, '#17211b', '600'); } });
        function downloadImage(url) { var link = document.createElement('a'); link.download = (state.name || 'matrix-workshop') + '.png'; link.href = url; link.click(); }
        if (canvas.toBlob) { canvas.toBlob(function (blob) { downloadImage(URL.createObjectURL(blob)); }, 'image/png'); } else { downloadImage(canvas.toDataURL('image/png')); }
      });

      render();
    }());
  </script>
</body>
</html>
